# Release builds for both channels, signed for MyGo's auto-update and
# published on GitHub Releases (LoTwT/youkai) — the update source the apps
# check (mygo.json's updates). Two channels, kept apart by MyGo's
# updates.tagPrefix (see docs/release.md):
#
#   - test:  tags test-v<version> (test-v0.0.1). Test builds check only
#     test-v releases, found through the GitHub API. Their releases are
#     published as ordinary releases — the updater only accepts published,
#     non-draft, non-prerelease releases — but never as the repository's
#     latest, and the title and notes say 测试版，勿用.
#   - stable: tags v<version> (v0.0.1). MyGo treats the prefix "v" as no
#     prefix: stable builds read the repository's latest release, which
#     test releases never become. (Even on the API path the prefix "v"
#     could not match a test-v… tag.)
#
# The draft release is created before the build so the Windows job uploads
# into it. The Windows job verifies its packaged layout (bundled resources,
# signatures, the recognition self-test and the updater state of the built
# artifact) before uploading; the publish job runs only after the Windows
# build succeeded, verifies the release's assets are complete, and
# publishes the draft for the channel. Only a draft is mutable: failed jobs
# can be re-run against the same tag's draft, replacing its assets
# (--clobber), while a published release is never touched again. Release
# state comes from the paginated release list (which includes drafts to
# push access), never from /releases/tags/{tag}: GitHub documents that
# endpoint as returning a published release only. Every list entry is
# validated before a tag is treated as absent; latest reads require a
# completed curl transfer (exit 0 and Content-Length agreement) before the
# HTTP status or body is interpreted. A 404 additionally requires a complete
# GitHub Not Found error body and a list whose public non-prerelease objects
# are all legal test tags (drafts and prereleases excluded); unknown public
# tags, contradictory or malformed state fail closed. A 200 latest tag must
# also agree with the same validated list. Same-tag runs are serialized by the
# workflow concurrency group; stable publish
# jobs additionally share one job-level group so the latest read/compare/
# edit is one interval across tags, while test publishes stay independent
# and builds are not serialized.
#
# Versions come from the tags: the source mygo.json stays at its
# development version, and the Windows job writes the tag's version and
# channel prefix into its checkout's copy of mygo.json — the built app,
# mygo.App.Version() and the tag always agree, without version bumps in
# the repository. Every released version needs a "## <version>" section in
# CHANGELOG.md: MyGo fails the build without it (the section becomes the
# in-app release notes), and the draft job checks it before building
# anything.
name: Release

on:
  push:
    tags:
      - "test-v*"
      - "v*"

permissions:
  contents: write # the draft release, the uploads to it, and publishing it

# Re-runs for the same tag queue instead of racing each other's release
# state. Different tags stay independent here; the publish job adds a
# stable-only job-level group for the latest read/compare/edit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: Validate the tag and create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the tag, the changelog and the update configuration
        # Fail before anything is built when the tag is malformed, its
        # version has no changelog section, or the update source is not in
        # place — a wrong tag then builds nothing at all.
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: tag $tag matches neither test-v* nor v*"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag $tag — the part after $prefix must be major.minor.patch (each a number), got: $version"
            exit 1
          fi
          echo "channel prefix: $prefix, version: $version"
          # The update manifests carry the version's CHANGELOG.md section
          # as the in-app release notes; `mygo build` fails the release
          # without it, and this early check names the fix.
          esc=$(printf '%s' "$version" | sed 's/\./\\./g')
          if ! grep -Eq "^## ${esc}( |\]|$)" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no \"## $version\" section — add one (its text becomes the release notes of both channels)"
            exit 1
          fi
          # A release build needs the update source in the configuration.
          if [ "$(jq -r '.updates.publicKey // empty' mygo.json)" = "" ] ||
             [ "$(jq -r '.updates.github // empty' mygo.json)" != "LoTwT/youkai" ]; then
            echo "ERROR: mygo.json must carry updates.publicKey and updates.github (\"LoTwT/youkai\") for release builds"
            exit 1
          fi
      - name: Check the pinned 5/6 badge model source
        shell: bash
        run: sha256sum -c internal/game/zzz/collect/storage_card_glyph_model.sha256
      - name: Create or reuse the draft release
        # The Windows job uploads into this draft only after its local
        # artifact checks and recognition self-test have all succeeded.
        # An existing draft for the same tag is reused so failed jobs can be
        # re-run; a published release is final and fails here before any
        # later job can touch it. The lookup reads the paginated release
        # list (drafts included to push access); any unreadable or malformed
        # state fails closed instead of creating a release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          state=$(bash scripts/release-state.sh tag "$tag") || {
            echo "ERROR: cannot determine whether release $tag exists; refusing to create or reuse it."
            exit 1
          }
          case "$(printf '%s\n' "$state" | jq -r '.state')" in
            absent)
              gh release create "$tag" --repo "$repo" \
                --draft --verify-tag --title "$tag" --generate-notes
              ;;
            release)
              if [ "$(printf '%s\n' "$state" | jq -r '.release.draft')" != "true" ]; then
                echo "ERROR: release $tag is already published; this workflow only creates or reuses drafts and never modifies a published release. Publish a new version instead."
                exit 1
              fi
              echo "reusing the existing draft release $tag"
              ;;
            *)
              echo "ERROR: unexpected state for release $tag; refusing to continue."
              exit 1
              ;;
          esac

  windows:
    name: Build and upload (windows/amd64)
    needs: draft-release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set the release version and channel in mygo.json
        # The version and channel come from the tag; the checkout's copy is
        # modified, never committed. The skip-worktree bit keeps that
        # rewrite out of `git status`, so the build stamps the tag's clean
        # commit (no "-modified") into the binary.
        shell: bash
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v" ;;
            v*) prefix="v" ;;
            *) echo "ERROR: unexpected tag $tag (the workflow triggers on test-v* and v*)"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          git update-index --skip-worktree mygo.json
          jq --arg version "$version" --arg tagPrefix "$prefix" \
            '.version = $version | .updates.tagPrefix = $tagPrefix' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "building Youkai $version on channel prefix $prefix"
      - name: Download OCR resources (fetchdeps)
        run: go run ./tools/fetchdeps -platform windows/amd64
      - name: Place the VC++ runtime DLLs next to the app (app-local)
        # App-local VC++ deployment (T3 绑定与运行库的实际交接): the four x64
        # CRT DLLs come from the runner's Visual Studio VC\Redist directory —
        # never unpacked from the vc_redist installer, never committed to Git.
        # MyGo merges resources/windows-amd64/ into the EXE's directory, which
        # is where the Windows loader looks when onnxruntime.dll (inside
        # onnxruntime/) resolves its static CRT imports. The runtime must be
        # no older than the toolset that built ONNX Runtime 1.32.0; the v14
        # series is binary-compatible, so the newest runtime available on
        # the runner is used.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio installation" }
          $redistRoot = Join-Path $vs "VC\Redist\MSVC"
          # VC\Redist\MSVC also holds non-version directories (e.g. "v145")
          # that [version] cannot parse, so only children named as dotted
          # numeric versions take part in the comparison.
          $latest = Get-ChildItem $redistRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $latest) { throw "no dotted-numeric VC\Redist\MSVC\<version> directory under $redistRoot" }
          # The CRT folder name carries the toolset generation
          # (Microsoft.VC143.CRT today, Microsoft.VC145.CRT on newer Visual
          # Studio); keep it unpinned and take the highest-numbered VC14x
          # directory under the chosen version's x64.
          $crt = Get-ChildItem (Join-Path $latest.FullName "x64") -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^Microsoft\.VC14\d*\.CRT$' } |
            Sort-Object { [int]($_.Name -replace '^Microsoft\.VC(\d+)\.CRT$', '$1') } -Descending |
            Select-Object -First 1
          if (-not $crt) { throw "no Microsoft.VC14*.CRT directory under $($latest.FullName)\x64" }
          $info = "VC++ redist version directory: $($latest.Name) ($($latest.FullName))"
          $info += "`nCRT directory (x64): $($crt.Name)"
          foreach ($name in "MSVCP140.dll","MSVCP140_1.dll","VCRUNTIME140.dll","VCRUNTIME140_1.dll") {
            $src = Join-Path $crt.FullName $name
            if (-not (Test-Path $src)) { throw "missing VC++ redist DLL: $src" }
            Copy-Item $src (Join-Path "resources/windows-amd64" $name) -Force
            $fileVersion = (Get-Item $src).VersionInfo.FileVersion
            $info += "`n$name  file version $fileVersion"
            Write-Host "$name  file version $fileVersion  <- $($latest.Name)\x64\$($crt.Name)"
          }
          # The info file lives in the runner's temp directory, never in
          # the checkout: Go stamps the build's VCS state from `git
          # status`, which counts untracked files as changes, so a process
          # file in the repository root would make the build report
          # commit=<sha>-modified (the Windows builds of test-v0.0.1 to
          # test-v0.0.4 did). The Package workflow's manifest step reads
          # it from there.
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "vc-redist-info.txt") -Value $info -Encoding utf8
      - name: Build the EXE, the NSIS installer and the signed update
        # Explicit CGO_ENABLED: MyGo defaults its child processes to
        # CGO_ENABLED=0 unless the environment overrides it. NSIS: MyGo
        # downloads it on Windows when makensis is not installed, and the
        # artifact check below fails loudly if the installer is missing.
        # MYGO_UPDATER_PRIVATE_KEY signs the update archive and manifest.
        env:
          CGO_ENABLED: "1"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run ./tools/mygobuild -platform windows/amd64
      - name: Verify the EXE, the installer, the packaged layout and the update files
        shell: bash
        run: |
          set -u
          exe="build/windows-amd64/Youkai.exe"
          setup=$(find build/windows-amd64 -maxdepth 1 -name "youkai-setup-${RELEASE_VERSION}-amd64.exe" -print -quit)
          archive="build/windows-amd64/youkai-${RELEASE_VERSION}-windows-amd64.tar.gz"
          manifest="build/windows-amd64/update-windows-amd64.json"
          fail=0
          if [ ! -f "$exe" ]; then
            echo "ERROR: missing executable: $exe"
            fail=1
          fi
          if [ -z "$setup" ]; then
            echo "ERROR: no NSIS installer under build/windows-amd64 — MyGo skips the installer with a mere warning when NSIS/makensis is unavailable; a release must produce it"
            fail=1
          fi
          # The merged resource root is the EXE's own directory: every
          # bundled artifact must sit right next to Youkai.exe.
          for f in \
            "onnxruntime/onnxruntime.dll" \
            "onnxruntime/onnxruntime_providers_shared.dll" \
            "onnxruntime/LICENSE" \
            "onnxruntime/ThirdPartyNotices.txt" \
            "models/PP-OCRv6_rec_small.onnx" \
            "THIRD-PARTY-NOTICES.md" \
            "MSVCP140.dll" \
            "MSVCP140_1.dll" \
            "VCRUNTIME140.dll" \
            "VCRUNTIME140_1.dll"; do
            if [ ! -e "build/windows-amd64/$f" ]; then
              echo "ERROR: missing packaged file next to the EXE: build/windows-amd64/$f"
              fail=1
            fi
          done
          for f in "$archive" "$manifest"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing update file — the build must sign updates, so MYGO_UPDATER_PRIVATE_KEY is missing or does not match updates.publicKey: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          # The manifest serves the tag's version and points its archive at
          # this very release.
          jq -e --arg version "$RELEASE_VERSION" --arg tag "$GITHUB_REF_NAME" \
            '.version == $version and (.url | endswith("/" + $tag + "/youkai-" + $version + "-windows-amd64.tar.gz"))' \
            "$manifest" > /dev/null || {
            echo "ERROR: $manifest does not serve version $RELEASE_VERSION from tag $GITHUB_REF_NAME"
            cat "$manifest"
            exit 1
          }
          echo "--- installer contents (7z listing) ---"
          7z l "$setup" || { echo "ERROR: 7z failed to list the installer"; exit 1; }
          echo "--- VC++ DLLs inside the installer ---"
          for name in MSVCP140.dll MSVCP140_1.dll VCRUNTIME140.dll VCRUNTIME140_1.dll; do
            7z l "$setup" | grep -i "$name" || { echo "ERROR: $name not found in the installer"; exit 1; }
          done
      - name: Verify the Windows installer and update archive against the tested EXE
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $out = "build/windows-amd64"
          ./scripts/verify-windows-package.ps1 -Executable "$out/Youkai.exe" `
            -Installer "$out/youkai-setup-$version-amd64.exe" -Updates enabled `
            -UpdateArchive "$out/youkai-$version-windows-amd64.tar.gz"
      - name: Upload verified artifacts, then the update manifest
        # Keep every upload after all checks. In particular, MyGo's
        # build -upload publishes before those later steps can reject a
        # broken layout. The manifest remains last, as in MyGo's uploader.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dir="build/windows-amd64"
          setup="$dir/youkai-setup-${RELEASE_VERSION}-amd64.exe"
          archive="$dir/youkai-${RELEASE_VERSION}-windows-amd64.tar.gz"
          manifest="$dir/update-windows-amd64.json"
          test -f "$setup" && test -f "$archive" && test -f "$manifest"
          test -f "$dir/install.ps1" && test -f build/SHA256SUMS
          (cd "$dir" && sha256sum -c ../SHA256SUMS)
          set -- "$setup" "$archive" "$dir/install.ps1" build/SHA256SUMS
          for delta in "$dir"/youkai-*-to-"${RELEASE_VERSION}"-windows-amd64.delta; do
            if [ -f "$delta" ]; then set -- "$@" "$delta"; fi
          done
          # The uploads below replace same-named assets (--clobber), which is
          # only safe while the release is still the draft this workflow
          # created. Read the draft through the list endpoint (the tag
          # endpoint only guarantees published releases) immediately before
          # writing; an absent, published, unreadable or malformed release
          # fails closed without replacing public artifacts.
          bash scripts/release-state.sh draft "$GITHUB_REF_NAME" > /dev/null || {
            echo "ERROR: release $GITHUB_REF_NAME is not a readable draft; refusing to upload."
            exit 1
          }
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$@"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$manifest"

  publish:
    name: Verify the release assets and publish
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # All stable publishes share one group: the latest read, comparison
      # and edit then form one mutually exclusive interval across tags.
      # Test publishes keep a per-tag group, and queue: max leaves different
      # releases pending instead of canceling them. Builds stay outside this
      # group and keep running per tag.
      group: ${{ startsWith(github.ref_name, 'test-v') && format('release-publish-test-{0}', github.ref) || 'release-publish-stable' }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the assets and publish the release
        # Only after the Windows job built, verified and uploaded: check
        # that the release holds every artifact — the installer, and the
        # update archive and manifest — then publish the draft for its
        # channel.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            test-v*) prefix="test-v"; channel="test" ;;
            v*) prefix="v"; channel="stable" ;;
            *) echo "ERROR: unexpected tag $tag (the workflow triggers on test-v* and v*)"; exit 1 ;;
          esac
          version="${tag#"$prefix"}"
          repo="${GITHUB_REPOSITORY}"
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          # One validated list read supplies the draft object and the
          # published-state facts used for the latest decision. The helper
          # only interprets latest after a completed curl transfer; a 404
          # also needs a complete GitHub Not Found body and a list whose
          # public non-prerelease objects are all legal test tags. Unknown
          # or contradictory state fails before this job can edit.
          facts=$(bash scripts/release-state.sh publish "$tag" "$channel") || {
            echo "ERROR: cannot read a consistent draft and latest state for $tag; refusing to verify or publish."
            exit 1
          }
          release=$(printf '%s\n' "$facts" | jq -c '.release') || {
            echo "ERROR: release state for $tag has no release object."
            exit 1
          }
          make_latest=$(printf '%s\n' "$facts" | jq -r '.make_latest') || {
            echo "ERROR: release state for $tag has no latest decision."
            exit 1
          }
          case "$make_latest" in
            true|false) ;;
            *) echo "ERROR: release state for $tag returned an invalid latest decision."; exit 1 ;;
          esac
          printf '%s\n' "$release" > "$dir/release.json"
          release_id=$(printf '%s' "$release" | jq -r '.id')
          case "$release_id" in
            ''|*[!0-9]*) echo "ERROR: release $tag has no numeric release id"; exit 1 ;;
          esac
          assets=$(printf '%s' "$release" | jq -r '.assets[].name')
          # MyGo v0.7+ uses the ASCII slug in installer asset names.
          need=(
            "youkai-setup-$version-amd64.exe"
            "youkai-$version-windows-amd64.tar.gz"
            "update-windows-amd64.json"
            "install.ps1"
            "SHA256SUMS"
          )
          fail=0
          for name in "${need[@]}"; do
            stored="${name// /.}"
            if ! printf '%s\n' "$assets" | grep -Fxq "$stored"; then
              echo "ERROR: the release is missing the asset: $stored"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "--- the release holds ---"
            printf '%s\n' "$assets"
            exit 1
          fi
          # The manifests the apps download must serve the tag's version.
          # Read the manifest through its asset ID: gh release download's
          # tag lookup is published-only as well.
          asset_id=$(printf '%s' "$release" | jq -r '.assets[] | select(.name == "update-windows-amd64.json") | .id')
          case "$asset_id" in
            ''|*[!0-9]*) echo "ERROR: release $tag has no usable update-windows-amd64.json asset id"; exit 1 ;;
          esac
          gh api "repos/$repo/releases/assets/$asset_id" \
            -H "Accept: application/octet-stream" > "$dir/update-windows-amd64.json"
          for target in windows-amd64; do
            got=$(jq -r '.version' "$dir/update-$target.json")
            if [ "$got" != "$version" ]; then
              echo "ERROR: update-$target.json serves version $got, want $version (the tag)"
              exit 1
            fi
          done
          # Generate the notes from the same draft object read above. The
          # generator builds public download URLs from the verified repo,
          # tag and asset names instead of a draft's untagged URL.
          node scripts/generate-release-downloads.mjs \
            --repo "$repo" --tag "$tag" "$dir/release.json" > "$dir/notes.md"
          # A published release is final: this step may only edit the same
          # draft it just read. Re-read immediately before writing so a
          # partial job re-run cannot rewrite public notes or move "latest".
          current=$(bash scripts/release-state.sh draft "$tag") || {
            echo "ERROR: release $tag is no longer a readable draft; refusing to modify it."
            exit 1
          }
          current_id=$(printf '%s\n' "$current" | jq -r '.release.id')
          if [ "$current_id" != "$release_id" ]; then
            echo "ERROR: release $tag changed while publishing (id $release_id -> $current_id); refusing to modify it."
            exit 1
          fi
          # Test-channel releases publish as ordinary releases — the MyGo
          # updater only accepts published, non-draft, non-prerelease
          # releases — but never as the repository's latest, which the
          # stable channel reads. make_latest came from the helper's
          # validated latest decision; a stable release only claims latest
          # when no higher published stable version exists.
          if [ "$channel" = "test" ]; then
            title="Youkai ${version}（测试版，勿用）"
          else
            title="Youkai $version"
          fi
          # Edit the exact release read above, not a tag that could resolve
          # to another object. The fields match the previous release-edit
          # arguments, including the test/stable latest choice.
          jq -n --arg name "$title" --arg body "$(cat "$dir/notes.md")" \
            --arg make_latest "$make_latest" \
            '{name: $name, body: $body, draft: false, prerelease: false, make_latest: $make_latest}' \
            > "$dir/publish.json"
          gh api -X PATCH "repos/$repo/releases/$release_id" \
            --input "$dir/publish.json" > /dev/null
          echo "published $tag on the $channel channel (latest: $make_latest)"
