# Lightweight checks for every pull request and push to main: gofmt, go vet,
# and go test on both target platforms, plus the MyGo UI vet on macOS. No
# installers, no long-running tests, no OCR resource downloads.
#
# cgo is used by the OCR bindings (internal/recognition). macOS jobs use the
# runner's Xcode toolchain (clang); Windows jobs use the MinGW gcc bundled
# with the runner image (gcc is part of the runner-images tool list, e.g.
# 15.2.0 on windows-latest / Windows Server 2025) with the default
# CGO_ENABLED=1, so no toolchain setup is needed here so far. This follows
# from the runner-images documentation and gets confirmed by the first CI run
# on a PR containing the bindings; if a runner image drops gcc, add a MinGW
# setup step here. Compiling here does not prove the native library loads on
# a real Windows machine; that remains a Windows test item.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # Apple Silicon (arm64)
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vet MyGo UI (macOS only)
        if: runner.os == 'macOS'
        run: go tool mygo vet .
